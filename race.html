<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micro Racer</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="race-page">
    <header class="topbar">
      <h1>Micro Racer</h1>
      <div class="controls">
        <label>
          Track:
          <select id="track-select" aria-label="Select track">
            <option value="oval">Oval</option>
            <option value="circuit">Circuit</option>
            <option value="switch">Switchback</option>
            <option value="figure8">Figure 8</option>
          </select>
        </label>
        <label>
          Mode:
          <select id="ai-select" aria-label="Mode and AI difficulty">
            <option value="easy">Race · Easy</option>
            <option value="normal" selected>Race · Normal</option>
            <option value="hard">Race · Hard</option>
            <option value="trial">Time trial</option>
          </select>
        </label>
        <button id="pause-btn" type="button" aria-pressed="false" title="Pause (P)">Pause</button>
        <button id="sound-btn" type="button" aria-pressed="false" aria-label="Toggle sound">Sound: Off</button>
        <button id="theme-btn" type="button" aria-pressed="false" aria-label="Toggle theme">Theme</button>
        <button id="restart-btn" type="button" title="Restart (R)">Restart</button>
      </div>
    </header>

    <main>
      <section class="hud race-hud">
        <div class="race-stat"><span class="race-label">Lap</span><span class="race-val"><span id="lap">1</span><small>/<span id="lap-total">3</span></small></span></div>
        <div class="race-stat"><span class="race-label">Position</span><span class="race-val"><span id="pos">4th</span><small>/<span id="car-total">4</span></small></span></div>
        <div class="race-stat"><span class="race-label">Time</span><span class="race-val" id="time">0.0</span></div>
        <div class="race-stat"><span class="race-label">Last lap</span><span class="race-val" id="last-lap">—</span></div>
        <div class="race-stat"><span class="race-label">Best lap</span><span class="race-val" id="best-lap">—</span></div>
        <div class="race-stat"><span class="race-label" id="best-race-label">Best race</span><span class="race-val" id="best-race">—</span></div>
        <div id="status" aria-live="polite"></div>
      </section>
      <section class="retro-wrap">
        <div class="retro-screen">
          <canvas id="game" width="640" height="360" aria-label="Race track"></canvas>
          <div class="scanlines" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <div id="vjoy" class="vjoy" aria-hidden="true">
      <div class="vjoy-base">
        <div class="vjoy-stick"></div>
      </div>
    </div>
    <button id="drift-btn" class="race-drift" type="button" aria-label="Handbrake (drift)">DRIFT</button>

    <footer class="footer">
      <small>
        Tiny top-down racer. 4 tracks · 3 AI levels · time trial with ghost. Best times are saved in this browser. ·
        <a href="index.html">Library</a> ·
        <a href="agents/software_developer.md">Dev Notes</a> ·
        <a href="agents/game_designer.md">Design Notes</a>
      </small>
    </footer>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box race-results">
        <h2 id="modal-title">Race Complete</h2>
        <p id="modal-message"></p>
        <p id="modal-badges" class="race-badge" hidden></p>
        <table>
          <thead><tr><th>Pos</th><th>Driver</th><th>Time</th><th>Best lap</th></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
        <div class="modal-actions">
          <button id="modal-restart" type="button">Race again (Enter)</button>
          <button id="modal-close" type="button">Close</button>
        </div>
      </div>
    </div>

    <script src="src/race.js"></script>
    <script src="src/race_ui.js"></script>
  </body>
</html>
