<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="memory-page">
    <header class="topbar">
      <h1>Memory Game</h1>
      <div class="controls">
        <label>
          Mode
          <select id="mode-select" aria-label="Game mode">
            <option value="relaxed">Relaxed</option>
            <option value="challenge">Challenge</option>
            <option value="timed">Time Attack</option>
            <option value="daily">Daily</option>
          </select>
        </label>
        <label>
          Board
          <select id="size-select" aria-label="Board size">
            <option value="3x4">3 × 4</option>
            <option value="4x4" selected>4 × 4</option>
            <option value="4x5">4 × 5</option>
            <option value="5x6">5 × 6</option>
            <option value="6x6">6 × 6</option>
          </select>
        </label>
        <label>
          Cards
          <select id="set-select" aria-label="Card symbols">
            <option value="mixed">Mixed</option>
            <option value="animals">Animals</option>
            <option value="food">Food</option>
            <option value="travel">Space &amp; travel</option>
            <option value="sports">Games &amp; sports</option>
          </select>
        </label>
        <button id="sound-btn" type="button" aria-pressed="false" title="Toggle sound (M)">Sound: Off</button>
        <button id="theme-btn" type="button" aria-pressed="false" title="Toggle light/dark theme">Theme</button>
        <button id="restart-btn" type="button" title="Restart (R)">Restart</button>
      </div>
    </header>

    <main>
      <section class="hud memory-hud" aria-label="Game stats">
        <div class="mem-stat"><span class="mem-label">Score</span><span id="score" class="mem-val">0</span></div>
        <div class="mem-stat"><span class="mem-label">Pairs</span><span id="pairs" class="mem-val">0/8</span></div>
        <div class="mem-stat" id="moves-stat"><span class="mem-label" id="moves-label">Moves</span><span id="moves" class="mem-val">0</span></div>
        <div class="mem-stat" title="Mismatches you could have avoided: you had already seen the right card"><span class="mem-label">Mistakes</span><span id="mistakes" class="mem-val">0</span></div>
        <div class="mem-stat" id="time-stat"><span class="mem-label" id="time-label">Time</span><span id="time" class="mem-val">0s</span></div>
        <div class="mem-stat"><span class="mem-label" id="best-label">Best</span><span id="best" class="mem-val">—</span></div>
      </section>
      <div class="memory-subbar">
        <div id="status" class="memory-status" role="status" aria-live="polite"></div>
        <button id="peek-btn" type="button" class="mem-peek" title="Show all cards for a moment, once per game (P)">👁 Peek <span>−100</span></button>
      </div>
      <section id="board" class="board" aria-label="Memory board"></section>
    </main>

    <footer class="footer">
      <small>
        Find every pair. Matches in a row build a streak; flipping a card you've already seen the wrong way costs points.
        Keyboard: arrows + Enter, R restart, P peek, M sound. ·
        <a href="index.html">Library</a> ·
        <a href="agents/software_developer.md">Dev Notes</a> ·
        <a href="agents/game_designer.md">Design Notes</a>
      </small>
    </footer>

    <!-- Modal for Win / Game Over -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box memory-result">
        <h2 id="modal-title">Game Over</h2>
        <p id="modal-badge" class="mem-badge hidden">New best!</p>
        <p id="modal-stars" class="mem-stars hidden" aria-label="3 of 3 stars"></p>
        <p id="modal-message"></p>
        <dl id="modal-stats" class="mem-stats"></dl>
        <div class="modal-actions">
          <button id="modal-next" type="button" class="hidden">Next board</button>
          <button id="modal-restart" type="button" class="primary">Play again</button>
          <button id="modal-close" type="button">Close</button>
        </div>
      </div>
    </div>

    <script src="src/game.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
