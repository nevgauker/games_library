<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pac-Man</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="pacman-page">
    <header class="topbar">
      <h1>Pac-Man</h1>
      <div class="controls">
        <button id="theme-btn" type="button" aria-pressed="false" aria-label="Toggle theme">Theme</button>
        <button id="pause-btn" type="button" aria-pressed="false">Pause (P)</button>
        <button id="restart-btn" type="button">Restart (R)</button>
      </div>
    </header>

    <main>
      <section class="hud pacman-hud">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div class="lives-wrap">Lives: <span id="lives" class="lives" role="img" aria-label="3 lives"></span></div>
        <div id="status" aria-live="polite"></div>
      </section>
      <section class="retro-wrap">
        <div class="retro-screen">
          <canvas id="game" width="448" height="448" aria-label="Pac-Man maze"></canvas>
          <div class="scanlines" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <small>
        Classic maze chase. Eat pills, dodge ghosts. ·
        <a href="index.html">Library</a> ·
        <a href="agents/software_developer.md">Dev Notes</a> ·
        <a href="agents/game_designer.md">Design Notes</a>
      </small>
    </footer>

    <!-- Mobile virtual joystick -->
    <div id="vjoy" class="vjoy" aria-hidden="true">
      <div class="vjoy-base">
        <div class="vjoy-stick"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <h2 id="modal-title">Game Over</h2>
        <p id="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-library" type="button">Library</button>
          <button id="modal-restart" type="button">Play again (R)</button>
        </div>
      </div>
    </div>

    <script src="src/pacman.js"></script>
    <script src="src/pacman_ui.js"></script>
  </body>
</html>
