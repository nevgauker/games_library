<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digger</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Digger</h1>
      <div class="controls">
        <button id="restart-btn" type="button">Restart (R)</button>
      </div>
    </header>

    <main>
      <section class="hud">
        <div>Level: <span id="level">1</span></div>
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Emeralds: <span id="emeralds">0</span></div>
        <div>Tip: Arrows/WASD move, Space pumps.</div>
        <div id="status" aria-live="polite"></div>
      </section>
      <section class="retro-wrap">
        <div class="retro-screen">
          <canvas id="game" width="640" height="480" aria-label="Digger playfield"></canvas>
          <div class="scanlines" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <small>
        Dig tunnels, collect emeralds, crush monsters with falling bags. ·
        <a href="index.html">Library</a> ·
        <a href="agents/software_developer.md">Dev Notes</a> ·
        <a href="agents/game_designer.md">Design Notes</a>
      </small>
    </footer>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <h2 id="modal-title">Digger</h2>
        <p id="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-next" class="hidden" type="button">Next Level</button>
          <button id="modal-restart" type="button">Restart</button>
          <button id="modal-close" type="button">Close</button>
        </div>
      </div>
    </div>

    <script src="src/digger.js"></script>
    <script src="src/digger_ui.js"></script>
  </body>
</html>
